# Rendered by setup/install.sh (sed substitution of ${BASE_DOMAIN}) into
# /etc/nginx/sites-available/shipway-dashboard.conf (and symlinked into
# sites-enabled). Fronts the Shipway tool itself: 127.0.0.1:8090, with
# websocket upgrade headers for the live deploy-log stream. Uses the
# wildcard cert (/etc/letsencrypt/live/${BASE_DOMAIN}/...) issued by
# install.sh's certbot step.
#
# Mirrors the shape of the node/nextjs vhosts server/src/system/templates.ts
# renders for individual projects (same proxy headers, same cert paths).

server {
    listen 80;
    server_name ship.${BASE_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ship.${BASE_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${BASE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${BASE_DOMAIN}/privkey.pem;

    client_max_body_size 200m;

    access_log /var/log/nginx/shipway-dashboard.access.log;
    error_log /var/log/nginx/shipway-dashboard.error.log;

    # -----------------------------------------------------------------------
    # Database consoles, gated by the Shipway session
    # -----------------------------------------------------------------------
    # phpMyAdmin and pgAdmin are served under paths on THIS host rather than
    # their own subdomains, which is what makes the gate below possible: the
    # browser already sends Shipway's session cookie to ship.<base-domain>, so
    # nginx can ask Shipway whether the caller is logged in before letting the
    # request reach either app. No second password, no basic-auth prompt, and
    # unauthenticated traffic never touches the PHP or the pgAdmin process.
    #
    # The trade this makes, recorded so it is a decision and not an accident:
    # same-origin means an XSS in phpMyAdmin or pgAdmin runs on the dashboard's
    # own origin and can call Shipway's API with the victim's session. Separate
    # subdomains would isolate that, at the cost of this gate and an extra
    # credential. The gate keeps unauthenticated attackers out entirely, which
    # is where the bulk of the risk lives.

    # Subrequest target for auth_request: returns 200 for a valid session and
    # 401 otherwise. `internal` means it cannot be requested from outside.
    location = /_shipway_session {
        internal;
        proxy_pass http://127.0.0.1:8090/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    # A bare 401 from auth_request would render as an empty error page; send the
    # browser to the dashboard (which shows its own login) instead.
    error_page 401 = @shipway_login;
    location @shipway_login {
        return 302 https://$host/;
    }

    # The signon shim (setup/db-signon.php, installed at /opt/shipway-db-signon).
    # The dashboard's Manage button on a MySQL database points here with that
    # database's id; the shim reads its credentials back from Shipway's own API
    # using the caller's session cookie and hands them to phpMyAdmin's signon
    # auth, so the link opens the database with no login form. Deliberately its
    # own exact-match location outside /db/phpmyadmin/: nothing under
    # phpMyAdmin's document root can be reached through this rule.
    location = /db/signon.php {
        auth_request /_shipway_session;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /opt/shipway-db-signon/signon.php;
        fastcgi_param DOCUMENT_ROOT /opt/shipway-db-signon;
        fastcgi_param SCRIPT_NAME /db/signon.php;
    }

    location /db/phpmyadmin/ {
        auth_request /_shipway_session;
        alias /opt/phpmyadmin/;
        index index.php;

        # Nested location for the PHP itself. The named capture plus an explicit
        # SCRIPT_FILENAME is required because `alias` and the usual
        # $document_root$fastcgi_script_name pairing do not compose — that combination
        # resolves against the alias target twice and 404s every script.
        location ~ ^/db/phpmyadmin/(?<pma_script>.+\.php)$ {
            auth_request /_shipway_session;
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /opt/phpmyadmin/$pma_script;
            fastcgi_param DOCUMENT_ROOT /opt/phpmyadmin;
            fastcgi_param SCRIPT_NAME /db/phpmyadmin/$pma_script;
            # Importing a dump can legitimately outlive the 60s default.
            fastcgi_read_timeout 300s;
        }
    }

    # pgAdmin 4, gunicorn on 127.0.0.1:5050 (pgadmin.service). The trailing
    # slash on both the location and proxy_pass strips the /db/pgadmin prefix
    # before it reaches the app; X-Script-Name then tells pgAdmin what prefix to
    # build its own URLs with — that header is exactly what pgAdmin4.py's
    # ReverseProxied middleware reads, so no app-side config is needed.
    location /db/pgadmin/ {
        auth_request /_shipway_session;

        # Who is signed in, lifted out of the auth subrequest's own response
        # (/api/auth/me sets this header) and forwarded to pgAdmin, which is
        # configured to trust it as the remote user — AUTHENTICATION_SOURCES in
        # pgadmin-config-local.py. That is what spares the user a second login:
        # pgAdmin creates and signs in the account itself. It can only ever be
        # the value Shipway just returned, never something a client sent: the
        # variable is set from the SUBREQUEST's response headers.
        auth_request_set $shipway_user $upstream_http_x_shipway_user;
        proxy_set_header X-Shipway-User $shipway_user;

        proxy_pass http://127.0.0.1:5050/;
        proxy_set_header X-Script-Name /db/pgadmin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The query tool and ERD run over SocketIO.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Backups/restores stream for a long time on a big database.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long enough for the slowest thing the API does synchronously: replaying an
        # uploaded SQL dump into a new database (POST /api/databases/:id/import), which
        # runs the mysql/psql client inline. Matches the phpMyAdmin import allowance above.
        proxy_read_timeout 300s;
    }
}

# Rendered by setup/install.sh (sed substitution of ${BASE_DOMAIN}) into
# /etc/nginx/sites-available/shipway-mailpit.conf (and symlinked into
# sites-enabled). Fronts the shared Mailpit web UI at 127.0.0.1:8025 (the
# catch-all SMTP inbox for projects with smtp_mode=mailpit). Uses the same
# wildcard cert as the dashboard vhost.
#
# Protected with HTTP basic auth (setup/install.sh's configure_mailpit_auth
# writes /etc/nginx/shipway-mailpit.htpasswd) — Mailpit has no auth of its
# own, and every deployed app's outgoing mail (including password-reset
# links) lands in this one shared mailbox, so it must not be reachable by
# anyone who just guesses the hostname.

server {
    listen 80;
    server_name mail.${BASE_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mail.${BASE_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${BASE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${BASE_DOMAIN}/privkey.pem;

    client_max_body_size 100m;

    access_log /var/log/nginx/shipway-mailpit.access.log;
    error_log /var/log/nginx/shipway-mailpit.error.log;

    auth_basic "Mailpit";
    auth_basic_user_file /etc/nginx/shipway-mailpit.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8025;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

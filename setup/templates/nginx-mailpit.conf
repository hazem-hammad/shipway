# Rendered by setup/install.sh (sed substitution of ${BASE_DOMAIN}) into
# /etc/nginx/sites-available/shipway-mailpit.conf (and symlinked into
# sites-enabled). Fronts the shared Mailpit web UI at 127.0.0.1:8025 (the
# catch-all SMTP inbox for projects with smtp_mode=mailpit). Uses the same
# wildcard cert as the dashboard vhost.

server {
    listen 80;
    server_name mail.${BASE_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl; http2 on;
    server_name mail.${BASE_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${BASE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${BASE_DOMAIN}/privkey.pem;

    client_max_body_size 100m;

    access_log /var/log/nginx/shipway-mailpit.access.log;
    error_log /var/log/nginx/shipway-mailpit.error.log;

    location / {
        proxy_pass http://127.0.0.1:8025;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
